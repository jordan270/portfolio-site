<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle Engine Demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #demo { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #26262b; color: white; font: 300 14px/1.4 system-ui, sans-serif; }
      #demo { position: fixed; inset: 0; }
      #controls { position: fixed; z-index: 2; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(420px, calc(100% - 40px)); text-align: center; padding: 14px 18px; background: #26262bcc; border-radius: 10px; }
      #shape-name { display: block; margin-bottom: 10px; letter-spacing: .08em; text-transform: uppercase; }
      input { width: 100%; accent-color: white; }
      .tune { display: grid; grid-template-columns: 90px 1fr 34px; align-items: center; gap: 8px; text-align: left; font-size: 12px; }
      .tune output { text-align: right; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="demo"></div>
    <div id="controls">
      <span id="shape-name">sphere</span>
      <input id="shape-step" type="range" min="0" max="3" step="0.01" value="0" aria-label="Particle shape" />
      <label class="tune">Size scale<input id="size-scale" type="range" min="0.25" max="2.5" step="0.05" value="1" /><output id="size-value">1.00</output></label>
      <label class="tune">Alpha scale<input id="alpha-scale" type="range" min="0" max="2" step="0.05" value="1" /><output id="alpha-value">1.00</output></label>
    </div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
